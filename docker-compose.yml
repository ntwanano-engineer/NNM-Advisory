# NNM Advisory — local development stack
# Run: docker compose up
# All three components start concurrently. The API is healthy when
#   curl http://localhost:5000/health returns HTTP 200.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nnm
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nnmdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnm -d nnmdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
