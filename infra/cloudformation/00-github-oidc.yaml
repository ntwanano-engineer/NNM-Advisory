AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NNM Advisory - GitHub Actions OIDC provider and deploy role. Lets the
  deploy workflow assume a role via OIDC (no stored AWS access keys). Deploy
  this once, then set its RoleArn output as the AWS_DEPLOY_ROLE_ARN secret.

Parameters:
  AppName:
    Type: String
    Default: nnm
  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the repo (e.g. ntwanano).
  GitHubRepo:
    Type: String
    Description: Repository name (e.g. nnm-advisory).
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if an iam oidc provider for token.actions.githubusercontent.com already exists.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-github-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only this repo's main branch may assume the role.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: nnm-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ecr
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: '*'
              - Sid: EcsDeploy
                Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:RunTask
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: '*'
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
              - Sid: FrontendDeploy
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${AppName}-web-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${AppName}-web-${AWS::AccountId}/*'
              - Sid: Invalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: '*'

Outputs:
  RoleArn:
    Description: Set this as the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn